<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Документы студента</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main style="padding: 40px 6vw;">
    <h1>Мои отсутствия</h1>

    <div th:each="a : ${absences}" style="background:#fff; padding:20px; margin-top:16px; border-radius:16px;">
        <p><b th:text="${a.student.fullName}"></b> · <span th:text="${a.subject}"></span> · <span th:text="${a.lessonDate}"></span></p>
        <form th:action="@{/student/apply}" method="post" style="margin-top:12px;">
            <input type="hidden" name="attendanceId" th:value="${a.id}">
            <input type="text" name="reason" placeholder="Причина отсутствия" required>
            <select name="documentType">
                <option>Медицинская справка</option>
                <option>Другой документ</option>
            </select>
            <button class="btn btn-main" type="submit">Отправить заявление</button>
        </form>
    </div>

    <h2 style="margin-top:36px;">Мои заявления</h2>
    <table style="width:100%; background:#fff; border-collapse:collapse; margin-top:12px;">
        <tr style="text-align:left;"><th>Предмет</th><th>Причина</th><th>Документ</th><th>Статус</th></tr>
        <tr th:each="app : ${applications}" style="border-top:1px solid #e8ecfa;">
            <td th:text="${app.attendance.subject}"></td>
            <td th:text="${app.reason}"></td>
            <td th:text="${app.documentType}"></td>
            <td>
        <span class="chip"
              th:classappend="${app.status.name() == 'APPROVED'} ? 'ok' : (${app.status.name() == 'REJECTED'} ? 'bad' : 'warn')"
              th:text="${app.status.name() == 'APPROVED'} ? 'Одобрено' : (${app.status.name() == 'REJECTED'} ? 'Отклонено' : 'На рассмотрении')"></span>
            </td>
        </tr>
    </table>
</main>
</body>
</html>
