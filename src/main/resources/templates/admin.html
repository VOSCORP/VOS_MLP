<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заявления — администратор</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main style="padding: 40px 6vw;">
    <h1>Заявления студентов</h1>
    <table style="width:100%; background:#fff; border-collapse:collapse; margin-top:20px;">
        <tr style="text-align:left;">
            <th>Студент</th><th>Предмет</th><th>Причина</th><th>Документ</th><th>Medical API</th><th>Статус</th><th>Действия</th>
        </tr>
        <tr th:each="app : ${applications}" style="border-top:1px solid #e8ecfa;">
            <td th:text="${app.attendance.student.fullName}"></td>
            <td th:text="${app.attendance.subject}"></td>
            <td th:text="${app.reason}"></td>
            <td th:text="${app.documentType}"></td>
            <td>
                <span th:if="${app.medicalResult == null}" class="chip warn">Не проверено</span>
                <span th:if="${app.medicalResult != null}" class="chip"
                      th:classappend="${app.medicalResult.name() == 'VALID'} ? 'ok' : (${app.medicalResult.name() == 'NOT_FOUND'} ? 'bad' : 'warn')"
                      th:text="${app.medicalResult.name()}"></span>
            </td>
            <td>
        <span class="chip"
              th:classappend="${app.status.name() == 'APPROVED'} ? 'ok' : (${app.status.name() == 'REJECTED'} ? 'bad' : 'warn')"
              th:text="${app.status.name() == 'APPROVED'} ? 'Одобрено' : (${app.status.name() == 'REJECTED'} ? 'Отклонено' : 'На рассмотрении')"></span>
            </td>
            <td>
                <form th:if="${app.status.name() == 'PENDING' and app.medicalResult == null}"
                      th:action="@{/admin/{id}/verify(id=${app.id})}" method="post" style="display:inline;">
                    <button class="btn btn-ghost" type="submit">Проверить</button>
                </form>
                <form th:if="${app.status.name() == 'PENDING' and app.medicalResult != null and app.medicalResult.name() == 'VALID'}"
                      th:action="@{/admin/{id}/approve(id=${app.id})}" method="post" style="display:inline;">
                    <button class="btn btn-main" type="submit">Одобрить</button>
                </form>
                <form th:if="${app.status.name() == 'PENDING'}"
                      th:action="@{/admin/{id}/reject(id=${app.id})}" method="post" style="display:inline;">
                    <button class="btn btn-ghost" type="submit">Отклонить</button>
                </form>
            </td>
        </tr>
    </table>
</main>
</body>
</html>
