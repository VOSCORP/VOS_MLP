<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<!-- Общий <head>: generalStyle.css, стиль страницы и защитный токен -->
<head th:fragment="head(title, pageCss)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' — VOS College'">VOS College</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/generalStyle.css}">
    <link rel="stylesheet" th:href="@{'/css/pages/' + ${pageCss}}">
</head>

<body>

<!-- Общий сайдбар: пункты зависят от роли -->
<aside class="sidebar" th:fragment="sidebar(active)">
    <div class="brand"><span class="brand-mark"></span>VOS College</div>
    <nav class="nav">
        <a class="nav-item" th:classappend="${active == 'home'} ? 'active'" th:href="@{/}">Главная</a>
        <a class="nav-item" th:if="${currentRole == 'ADMIN' or currentRole == 'TEACHER'}"
           th:classappend="${active == 'attendance'} ? 'active'" th:href="@{/teacher}">Посещаемость</a>
        <a class="nav-item" th:classappend="${active == 'journal'} ? 'active'" th:href="@{/journal}">Журнал</a>
        <a class="nav-item" th:if="${currentRole == 'ADMIN' or currentRole == 'STUDENT' or currentRole == 'STAROSTA'}"
           th:classappend="${active == 'documents'} ? 'active'" th:href="@{/student}">Документы</a>
        <a class="nav-item" th:if="${currentRole == 'ADMIN' or currentRole == 'TEACHER'}"
           th:classappend="${active == 'grades'} ? 'active'" th:href="@{/grades}">Оценки</a>
        <a class="nav-item" th:if="${currentRole == 'ADMIN'}"
           th:classappend="${active == 'admin'} ? 'active'" th:href="@{/admin}">Администрирование</a>
        <span class="nav-item soon">Расписание <span class="nav-soon-tag">скоро</span></span>
    </nav>
    <div class="sidebar-foot">Учебный проект · Spring Boot</div>
</aside>

<!-- Общая верхняя панель: имя, роль, выход -->
<header class="topbar" th:fragment="topbar(title)">
    <h1 th:text="${title}">Страница</h1>
    <div class="topbar-right">
    <span class="topbar-user" th:if="${currentName}">
      <span th:text="${currentName}"></span> · <span th:text="${currentRoleLabel}"></span>
    </span>
        <form th:action="@{/logout}" method="post">
            <button class="btn" type="submit">Выйти</button>
        </form>
    </div>
</header>

</body>
</html>
