<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Администрирование', 'adminStyle.css')}"></head>
<body>
<div class="app">
  <aside th:replace="~{layout/layout :: sidebar('admin')}"></aside>
  <div class="content">
    <header th:replace="~{layout/layout :: topbar('Администрирование')}"></header>
    <main class="page">

      <p class="admin-note">Заявки студентов появятся в разделе «Документы». Здесь замечания и решения об отчислении.</p>

      <h2 class="section-title" style="margin-top:0;">Дисциплинарные замечания</h2>
      <div class="table-wrap">
        <table class="table">
          <tr><th>Студент</th><th>Основание</th><th>Дата</th><th>Статус</th></tr>
          <tr th:each="n : ${notices}">
            <td th:text="${n.student.fullName}"></td>
            <td th:text="${n.reason}"></td>
            <td th:text="${n.createdAtText}"></td>
            <td><span class="chip warn" th:text="${n.status.name()}"></span></td>
          </tr>
        </table>
      </div>

      <h2 class="section-title">Предложения об отчислении</h2>
      <div class="table-wrap">
        <table class="table">
          <tr><th>Студент</th><th>Группа</th><th>Замечаний</th><th>Предложение</th><th>Студент</th><th>Действия</th></tr>
          <tr th:each="p : ${proposals}">
            <td th:text="${p.student.fullName}"></td>
            <td th:text="${p.student.groupName}"></td>
            <td th:text="${p.noticeCount}"></td>
            <td>
              <span class="chip"
                    th:classappend="${p.status.name() == 'CONFIRMED'} ? 'bad' : (${p.status.name() == 'REJECTED'} ? 'ok' : 'warn')"
                    th:text="${p.status.name() == 'CONFIRMED'} ? 'Подтверждено' : (${p.status.name() == 'REJECTED'} ? 'Отклонено' : 'Ждёт решения')"></span>
            </td>
            <td th:text="${p.student.status.name() == 'EXPELLED'} ? 'Отчислен' : 'Учится'"></td>
            <td>
              <div class="actions">
                <form th:if="${p.status.name() == 'PENDING_ADMIN_APPROVAL'}"
                      th:action="@{/admin/proposals/{id}/confirm(id=${p.id})}" method="post">
                  <button class="btn btn-main" type="submit">Подтвердить отчисление</button>
                </form>
                <form th:if="${p.status.name() == 'PENDING_ADMIN_APPROVAL'}"
                      th:action="@{/admin/proposals/{id}/reject(id=${p.id})}" method="post">
                  <button class="btn" type="submit">Отклонить</button>
                </form>
              </div>
            </td>
          </tr>
        </table>
      </div>

    </main>
  </div>
</div>
</body>
</html>
