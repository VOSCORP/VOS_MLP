<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Журнал', 'journalStyle.css')}"></head>
<body>
<div class="app">
    <aside th:replace="~{layout/layout :: sidebar('journal')}"></aside>
    <div class="content">
        <header th:replace="~{layout/layout :: topbar('Электронный журнал')}"></header>
        <main class="page">

            <p th:if="${empty}">Групп и предметов пока нет.</p>

            <div th:unless="${empty}">
                <form class="journal-filter" method="get" th:action="@{/journal}">
                    <select name="groupId">
                        <option th:each="g : ${groups}" th:value="${g.id}" th:text="${g.name}"
                                th:selected="${g.id == selectedGroupId}"></option>
                    </select>
                    <select name="subjectId">
                        <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name}"
                                th:selected="${s.id == selectedSubjectId}"></option>
                    </select>
                    <button class="btn btn-main" type="submit">Показать</button>
                </form>

                <div class="journal-scroll">
                    <table class="journal">
                        <thead>
                        <tr>
                            <th class="col-num">№</th>
                            <th class="col-name">ФИО</th>
                            <th th:each="c : ${columnViews}" th:class="${c.css}" th:text="${c.label}"></th>
                            <th class="col-avg">Средний</th>
                        </tr>
                        <tr class="task-row">
                            <td class="col-num"></td>
                            <td class="col-name">Что сдать</td>
                            <td th:each="c : ${columnViews}" th:text="${c.task}"></td>
                            <td class="col-avg"></td>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="row, st : ${rows}">
                            <td class="col-num" th:text="${st.count}"></td>
                            <td class="col-name" th:text="${row.name}"></td>
                            <td th:each="cell : ${row.cells}" th:class="${'cell ' + cell.css}"
                                th:text="${cell.text}" th:title="${cell.title}"></td>
                            <td class="col-avg" th:text="${row.average}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <p class="journal-legend">
                    <span class="legend late">Опоздание</span>
                    <span class="legend absent">Пропуск</span>
                    <span class="legend makeup">Отработка (макс. 80)</span>
                </p>
            </div>

        </main>
    </div>
</div>
</body>
</html>
